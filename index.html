<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoomSpectors 🕵️‍♀️</title>

  <!-- Favicon SVG Integrado -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️‍♀️</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .animate-pulse-soft {
      animation: pulse-soft 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-900">

  <!-- Header / Barra Superior -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchView('detective')">
      <span class="text-2xl">🕵️‍♀️</span>
      <h1 class="font-black text-lg tracking-wider text-amber-400">ZOOMSPECTORS</h1>
    </div>
    <nav class="flex gap-2">
      <button onclick="switchView('detective')" id="btn-tab-detective" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-500 text-slate-950">
        🎮 Jugar
      </button>
      <button onclick="switchView('creator')" id="btn-tab-creator" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700">
        ⚙️ Creador
      </button>
    </nav>
  </header>

  <main class="max-w-md mx-auto p-4 pb-20">

    <!-- VISTA 1: MODO DETECTIVE (HIJA) -->
    <section id="view-detective" class="space-y-4">
      <!-- Grid de Misiones -->
      <div id="missions-grid" class="space-y-4">
        <!-- Las tarjetas se renderizan dinámicamente -->
      </div>
    </section>

    <!-- VISTA 2: MODO CREADOR (PAPÁ) -->
    <section id="view-creator" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h2 class="text-base font-bold text-amber-400 mb-1">Nueva Misión Secreta</h2>
        <p class="text-xs text-slate-400 mb-4">Toma una foto de cerca a un objeto y asigna las pistas.</p>

        <form id="form-mission" class="space-y-4">
          <!-- Captura de Foto -->
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">1. Foto en detalle (Close-up)</label>
            <div id="photo-preview-container" class="relative w-full h-44 bg-slate-950 border-2 border-dashed border-slate-800 rounded-xl overflow-hidden flex flex-col items-center justify-center cursor-pointer hover:border-amber-500/50 transition" onclick="document.getElementById('input-photo').click()">
              <img id="photo-preview" class="hidden w-full h-full object-cover">
              <div id="photo-placeholder" class="text-center p-4">
                <span class="text-3xl">📸</span>
                <p class="text-xs text-slate-400 mt-1 font-semibold">Toca para tomar o subir foto</p>
              </div>
            </div>
            <input type="file" id="input-photo" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelect(event)">
          </div>

          <!-- Pista 1: Lugar -->
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">2. Pista 1 (Lugar)</label>
            <select id="select-place" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
              <option value="🛏️ Cuarto">🛏️ Cuarto</option>
              <option value="🧸 Cuarto Elena">🧸 Cuarto Elena</option>
              <option value="🛋️ Sala">🛋️ Sala</option>
              <option value="🍽️ Comedor">🍽️ Comedor</option>
              <option value="🍳 Cocina">🍳 Cocina</option>
              <option value="🌿 Patio / Terraza">🌿 Patio / Terraza</option>
            </select>
          </div>

          <!-- Pista 2: Dónde mirar -->
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">3. Pista 2 (Dirección)</label>
            <select id="select-direction" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
              <option value="⬇️ Mira Abajo">⬇️ Mira Abajo</option>
              <option value="⬆️ Mira Arriba">⬆️ Mira Arriba</option>
              <option value="⬅️ Hacia la Izquierda">⬅️ Hacia la Izquierda</option>
              <option value="➡️ Hacia la Derecha">➡️ Hacia la Derecha</option>
            </select>
          </div>

          <!-- Botón de Guardar -->
          <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-sm transition shadow-lg shadow-amber-500/10">
            ➕ Guardar Misión
          </button>
        </form>
      </div>

      <!-- Administrar Misiones -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-bold text-slate-300">Administrar Misiones</h3>
          <button onclick="clearAllMissions()" class="text-xs text-rose-400 hover:underline">Borrar todo</button>
        </div>
        <div id="creator-missions-list" class="space-y-2">
          <!-- Lista administrable -->
        </div>
      </div>
    </section>

  </main>

  <script>
    // ESTADO DE LA APP
    let missions = JSON.parse(localStorage.getItem('zoom_spectors_missions')) || [];
    let currentPhotoBase64 = null;
    let activeTimers = {};

    // INICIALIZACIÓN
    document.addEventListener('DOMContentLoaded', () => {
      renderMissions();
    });

    // NAVEGACIÓN
    function switchView(view) {
      const viewDetective = document.getElementById('view-detective');
      const viewCreator = document.getElementById('view-creator');
      const btnDetective = document.getElementById('btn-tab-detective');
      const btnCreator = document.getElementById('btn-tab-creator');

      if (view === 'detective') {
        viewDetective.classList.remove('hidden');
        viewCreator.classList.add('hidden');
        btnDetective.className = 'px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-500 text-slate-950';
        btnCreator.className = 'px-3 py-1.5 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700';
        renderMissions();
      } else {
        viewCreator.classList.remove('hidden');
        viewDetective.classList.add('hidden');
        btnCreator.className = 'px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-500 text-slate-950';
        btnDetective.className = 'px-3 py-1.5 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700';
        renderCreatorList();
      }
    }

    // PROCESAMIENTO DE FOTO
    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
          
          document.getElementById('photo-preview').src = currentPhotoBase64;
          document.getElementById('photo-preview').classList.remove('hidden');
          document.getElementById('photo-placeholder').classList.add('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // GUARDAR MISIÓN
    document.getElementById('form-mission').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentPhotoBase64) {
        alert('Por favor toma o selecciona una foto primero.');
        return;
      }

      const newMission = {
        id: Date.now(),
        image: currentPhotoBase64,
        place: document.getElementById('select-place').value,
        direction: document.getElementById('select-direction').value,
        solved: false,
        hint1Unlocked: false,
        hint2Unlocked: false,
        timer1Count: 10,
        timer2Count: 10
      };

      missions.push(newMission);
      saveToStorage();

      currentPhotoBase64 = null;
      document.getElementById('photo-preview').classList.add('hidden');
      document.getElementById('photo-placeholder').classList.remove('hidden');
      document.getElementById('form-mission').reset();

      switchView('detective');
    });

    // RENDERIZAR TARJETAS EN MODO DETECTIVE
    function renderMissions() {
      const grid = document.getElementById('missions-grid');
      grid.innerHTML = '';

      // Limpiar temporizadores previos
      Object.keys(activeTimers).forEach(key => clearInterval(activeTimers[key]));
      activeTimers = {};

      if (missions.length === 0) {
        grid.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <span class="text-5xl block mb-3">🕵️‍♀️</span>
            <p class="text-xs">No hay misiones activas.<br>Ve a la pestaña <b>Creador</b> para agregar una.</p>
          </div>
        `;
        return;
      }

      missions.forEach((mission, index) => {
        const card = document.createElement('div');
        card.className = `relative bg-slate-900 border rounded-2xl overflow-hidden shadow-xl transition-all ${
          mission.solved ? 'border-emerald-500/50' : 'border-slate-800'
        }`;

        card.innerHTML = `
          <!-- Imagen Principal -->
          <div class="relative w-full aspect-square bg-slate-950">
            <img src="${mission.image}" class="w-full h-full object-cover ${mission.solved ? 'brightness-90' : ''}">
            
            <!-- Badge Número de Misión -->
            <div class="absolute top-3 left-3 px-2.5 py-1 rounded-xl bg-slate-950/80 backdrop-blur text-xs font-black text-amber-400 border border-slate-800 shadow">
              #${index + 1}
            </div>

            <!-- Check de Encontrado Superpuesto -->
            ${mission.solved ? `
              <div class="absolute top-3 right-3 w-9 h-9 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-black text-lg shadow-lg">
                ✓
              </div>
            ` : ''}
          </div>

          <!-- Barra de Pistas en Íconos -->
          <div class="p-3 bg-slate-900 space-y-2">
            <!-- Pista 1 Display -->
            ${mission.hint1Unlocked ? `
              <div class="p-2 bg-slate-950 border border-amber-500/30 rounded-xl text-center text-xs font-bold text-amber-300">
                ${mission.place}
              </div>
            ` : ''}

            <!-- Pista 2 Display -->
            ${mission.hint2Unlocked ? `
              <div class="p-2 bg-slate-950 border border-amber-500/30 rounded-xl text-center text-xs font-bold text-amber-300">
                ${mission.direction}
              </div>
            ` : ''}

            <!-- Controles de Botones con Íconos -->
            ${!mission.solved ? `
              <div class="grid grid-cols-3 gap-2 pt-1">
                <!-- Ícono Pista 1 (Lugar) -->
                <button id="btn-h1-${mission.id}" onclick="triggerHint1(${mission.id})" 
                  class="py-3 rounded-xl flex flex-col items-center justify-center transition ${
                    mission.hint1Unlocked 
                      ? 'bg-amber-500/20 border border-amber-500/40 text-amber-400' 
                      : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                  }">
                  <span class="text-xl">📍</span>
                  <span id="label-h1-${mission.id}" class="text-[10px] font-bold mt-0.5">
                    ${mission.hint1Unlocked ? 'Pista 1' : 'Pista 1'}
                  </span>
                </button>

                <!-- Ícono Pista 2 (Dirección) -->
                <button id="btn-h2-${mission.id}" onclick="triggerHint2(${mission.id})" 
                  ${!mission.hint1Unlocked ? 'disabled' : ''}
                  class="py-3 rounded-xl flex flex-col items-center justify-center transition ${
                    mission.hint2Unlocked 
                      ? 'bg-amber-500/20 border border-amber-500/40 text-amber-400' 
                      : !mission.hint1Unlocked 
                        ? 'bg-slate-950 opacity-40 text-slate-600' 
                        : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                  }">
                  <span class="text-xl">🎯</span>
                  <span id="label-h2-${mission.id}" class="text-[10px] font-bold mt-0.5">
                    ${mission.hint2Unlocked ? 'Pista 2' : 'Pista 2'}
                  </span>
                </button>

                <!-- Ícono Encontrado -->
                <button onclick="markAsSolved(${mission.id})" 
                  class="py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl flex flex-col items-center justify-center font-black transition shadow-lg shadow-emerald-500/10 active:scale-95">
                  <span class="text-xl">🔍</span>
                  <span class="text-[10px] uppercase font-black tracking-wider mt-0.5">¡Listo!</span>
                </button>
              </div>
            ` : ''}
          </div>
        `;

        grid.appendChild(card);

        // Reanudar temporizadores si estaban en progreso
        if (!mission.solved) {
          if (!mission.hint1Unlocked && mission.timer1Count < 10 && mission.timer1Count > 0) {
            runTimer1(mission.id);
          }
          if (mission.hint1Unlocked && !mission.hint2Unlocked && mission.timer2Count < 10 && mission.timer2Count > 0) {
            runTimer2(mission.id);
          }
        }
      });
    }

    // ACCIONES DE PISTAS (SISTEMA DE CONTEO)
    function triggerHint1(id) {
      const mission = missions.find(m => m.id === id);
      if (!mission || mission.hint1Unlocked) return;

      if (mission.timer1Count === 10) {
        runTimer1(id);
      }
    }

    function runTimer1(id) {
      const mission = missions.find(m => m.id === id);
      if (!mission) return;

      const btn = document.getElementById(`btn-h1-${id}`);
      const label = document.getElementById(`label-h1-${id}`);

      if (btn) btn.className = "py-3 bg-slate-800 border border-amber-500/50 text-amber-400 rounded-xl flex flex-col items-center justify-center";

      clearInterval(activeTimers[`h1_${id}`]);
      activeTimers[`h1_${id}`] = setInterval(() => {
        mission.timer1Count--;
        if (label) label.textContent = `${mission.timer1Count}s`;

        if (mission.timer1Count <= 0) {
          clearInterval(activeTimers[`h1_${id}`]);
          mission.hint1Unlocked = true;
          saveToStorage();
          renderMissions();
          triggerHint2(id); // Iniciar automáticamente el reloj para Pista 2
        }
      }, 1000);
    }

    function triggerHint2(id) {
      const mission = missions.find(m => m.id === id);
      if (!mission || !mission.hint1Unlocked || mission.hint2Unlocked) return;

      if (mission.timer2Count === 10) {
        runTimer2(id);
      }
    }

    function runTimer2(id) {
      const mission = missions.find(m => m.id === id);
      if (!mission) return;

      const btn = document.getElementById(`btn-h2-${id}`);
      const label = document.getElementById(`label-h2-${id}`);

      if (btn) btn.className = "py-3 bg-slate-800 border border-amber-500/50 text-amber-400 rounded-xl flex flex-col items-center justify-center";

      clearInterval(activeTimers[`h2_${id}`]);
      activeTimers[`h2_${id}`] = setInterval(() => {
        mission.timer2Count--;
        if (label) label.textContent = `${mission.timer2Count}s`;

        if (mission.timer2Count <= 0) {
          clearInterval(activeTimers[`h2_${id}`]);
          mission.hint2Unlocked = true;
          saveToStorage();
          renderMissions();
        }
      }, 1000);
    }

    // RESOLVER MISIÓN (SOLO CONFETI, SIN MODALES)
    function markAsSolved(id) {
      const mission = missions.find(m => m.id === id);
      if (mission) {
        mission.solved = true;
        saveToStorage();

        // Lanzar confeti inmediato
        confetti({
          particleCount: 80,
          spread: 60,
          origin: { y: 0.7 }
        });

        renderMissions();
      }
    }

    // ADMINISTRACIÓN MODO CREADOR
    function renderCreatorList() {
      const container = document.getElementById('creator-missions-list');
      container.innerHTML = '';

      if (missions.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500">Sin misiones activas.</p>';
        return;
      }

      missions.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800';
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${m.image}" class="w-10 h-10 object-cover rounded-lg">
            <div>
              <p class="text-xs font-bold text-slate-200">Misión #${idx + 1}</p>
              <p class="text-[10px] text-slate-400">${m.place} | ${m.direction}</p>
            </div>
          </div>
          <button onclick="deleteMission(${m.id})" class="text-xs text-rose-400 p-2 hover:bg-slate-900 rounded-lg">🗑️</button>
        `;
        container.appendChild(item);
      });
    }

    function deleteMission(id) {
      missions = missions.filter(m => m.id !== id);
      saveToStorage();
      renderCreatorList();
    }

    function clearAllMissions() {
      if (confirm('¿Seguro que quieres borrar todas las misiones?')) {
        missions = [];
        saveToStorage();
        renderCreatorList();
      }
    }

    function saveToStorage() {
      localStorage.setItem('zoom_spectors_missions', JSON.stringify(missions));
    }
  </script>
</body>
</html>
